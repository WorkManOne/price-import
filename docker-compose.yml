# docker compose up --build  -> сервис на http://localhost:8080
# docker compose --profile test run --rm tests  -> все тесты с -race на настоящем postgres
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prices
      POSTGRES_PASSWORD: prices
      POSTGRES_DB: prices
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432" # наружу на 5433, чтоб не драться с локальным postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prices -d prices"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgres://prices:prices@db:5432/prices?sslmode=disable
      HTTP_ADDR: ":8080"
      MAX_UPLOAD_MB: "20"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  tests:
    profiles: ["test"]
    build:
      context: .
      target: build
    environment:
      TEST_DATABASE_URL: postgres://prices:prices@db:5432/prices?sslmode=disable
      CGO_ENABLED: "1"
    command: ["go", "test", "-race", "-count=1", "./..."]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
